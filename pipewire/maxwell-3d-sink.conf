# Maxwell 3D: 7.1 -> binaural virtual sink with per-speaker HRTF spatializers.
#
# Install:
#   mkdir -p ~/.config/pipewire/pipewire.conf.d
#   ln -s $PWD/maxwell-3d-sink.conf ~/.config/pipewire/pipewire.conf.d/
#   systemctl --user restart pipewire
#
# Each surround channel feeds its own `sofa` spatializer placed at the
# standard ITU 7.1 position. The head tracking daemon rewrites the
# Azimuth/Elevation controls of every `sp*` node at runtime.
#
# HRTF: SADIE II, subject D1 (Neumann KU100 dummy head), 48 kHz, University of
# York, Apache-2.0: https://zenodo.org/records/12092466 (D1_HRIR_SOFA.zip).
# Unzip D1_48K_24bit_256tap_FIR_SOFA.sofa into ~/.local/share/pipewire/hrtf-sofa/.
# The sofa plugin does not expand `~`: filenames must be absolute. If the file
# can't be opened the sink still appears but stays silent.
# /usr/share/libmysofa/default.sofa (MIT KEMAR) is a fallback, but it loses
# about 25 dB of bass and would need its gain raised by about 20 dB.
#
# SADIE has about +8 dB of gain, and content common to several channels reaches
# each ear from every speaker. `gain = 0.125` (-18 dB) keeps full-scale stereo
# with identical left/right below 0 dBFS (worst case: ~4 kHz pinna resonance).
#
# Room: the spatializers are anechoic, which tends to sound inside the head.
# Reflections and reverb come from SADIE II D1's room measurements (BRIRs,
# D1_BRIR_SOFA.zip in the same record) with the direct sound removed, made by
# tools/room-tails/make_room_tails.py into ~/.local/share/pipewire/hrtf-sofa/room/,
# which also equalises the room part flat (the room alone is dark and boomy).
# They play through fixed convolvers: unlike the spatializers they don't follow
# the head (and so never reload and click). They match the D1 HRTF; with
# another HRTF they still work but the levels are only approximately right.
# If the WAV files are missing the room part stays silent.
#
# SOFA angle convention: azimuth 0 = front, counter-clockwise (90 = left).

context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Maxwell 3D (7.1 spatial)"
            media.name       = "Maxwell 3D (7.1 spatial)"
            filter.graph = {
                nodes = [
                    # Each surround channel is copied to its spatializer (direct sound) and
                    # to a pair of room convolvers (reflections and reverb, see the header).
                    { type = builtin label = copy name = inFL }
                    { type = builtin label = copy name = inFR }
                    { type = builtin label = copy name = inFC }
                    { type = builtin label = copy name = inSL }
                    { type = builtin label = copy name = inSR }
                    { type = builtin label = copy name = inRL }
                    { type = builtin label = copy name = inRR }

                    { type = sofa label = spatializer name = spFL
                      config = { filename = "/home/yngwe/.local/share/pipewire/hrtf-sofa/D1_48K_24bit_256tap_FIR_SOFA.sofa" gain = 0.125 }
                      control = { "Azimuth" = 30.0  "Elevation" = 0.0 "Radius" = 2.0 } }
                    { type = sofa label = spatializer name = spFR
                      config = { filename = "/home/yngwe/.local/share/pipewire/hrtf-sofa/D1_48K_24bit_256tap_FIR_SOFA.sofa" gain = 0.125 }
                      control = { "Azimuth" = 330.0 "Elevation" = 0.0 "Radius" = 2.0 } }
                    { type = sofa label = spatializer name = spFC
                      config = { filename = "/home/yngwe/.local/share/pipewire/hrtf-sofa/D1_48K_24bit_256tap_FIR_SOFA.sofa" gain = 0.125 }
                      control = { "Azimuth" = 0.0   "Elevation" = 0.0 "Radius" = 2.0 } }
                    { type = sofa label = spatializer name = spSL
                      config = { filename = "/home/yngwe/.local/share/pipewire/hrtf-sofa/D1_48K_24bit_256tap_FIR_SOFA.sofa" gain = 0.125 }
                      control = { "Azimuth" = 90.0  "Elevation" = 0.0 "Radius" = 2.0 } }
                    { type = sofa label = spatializer name = spSR
                      config = { filename = "/home/yngwe/.local/share/pipewire/hrtf-sofa/D1_48K_24bit_256tap_FIR_SOFA.sofa" gain = 0.125 }
                      control = { "Azimuth" = 270.0 "Elevation" = 0.0 "Radius" = 2.0 } }
                    { type = sofa label = spatializer name = spRL
                      config = { filename = "/home/yngwe/.local/share/pipewire/hrtf-sofa/D1_48K_24bit_256tap_FIR_SOFA.sofa" gain = 0.125 }
                      control = { "Azimuth" = 150.0 "Elevation" = 0.0 "Radius" = 2.0 } }
                    { type = sofa label = spatializer name = spRR
                      config = { filename = "/home/yngwe/.local/share/pipewire/hrtf-sofa/D1_48K_24bit_256tap_FIR_SOFA.sofa" gain = 0.125 }
                      control = { "Azimuth" = 210.0 "Elevation" = 0.0 "Radius" = 2.0 } }

                    { type = builtin label = convolver name = rmFLL
                      config = { filename = "/home/yngwe/.local/share/pipewire/hrtf-sofa/room/room_FL.wav" channel = 0 gain = 0.125 } }
                    { type = builtin label = convolver name = rmFLR
                      config = { filename = "/home/yngwe/.local/share/pipewire/hrtf-sofa/room/room_FL.wav" channel = 1 gain = 0.125 } }
                    { type = builtin label = convolver name = rmFRL
                      config = { filename = "/home/yngwe/.local/share/pipewire/hrtf-sofa/room/room_FR.wav" channel = 0 gain = 0.125 } }
                    { type = builtin label = convolver name = rmFRR
                      config = { filename = "/home/yngwe/.local/share/pipewire/hrtf-sofa/room/room_FR.wav" channel = 1 gain = 0.125 } }
                    { type = builtin label = convolver name = rmFCL
                      config = { filename = "/home/yngwe/.local/share/pipewire/hrtf-sofa/room/room_FC.wav" channel = 0 gain = 0.125 } }
                    { type = builtin label = convolver name = rmFCR
                      config = { filename = "/home/yngwe/.local/share/pipewire/hrtf-sofa/room/room_FC.wav" channel = 1 gain = 0.125 } }
                    { type = builtin label = convolver name = rmSLL
                      config = { filename = "/home/yngwe/.local/share/pipewire/hrtf-sofa/room/room_SL.wav" channel = 0 gain = 0.125 } }
                    { type = builtin label = convolver name = rmSLR
                      config = { filename = "/home/yngwe/.local/share/pipewire/hrtf-sofa/room/room_SL.wav" channel = 1 gain = 0.125 } }
                    { type = builtin label = convolver name = rmSRL
                      config = { filename = "/home/yngwe/.local/share/pipewire/hrtf-sofa/room/room_SR.wav" channel = 0 gain = 0.125 } }
                    { type = builtin label = convolver name = rmSRR
                      config = { filename = "/home/yngwe/.local/share/pipewire/hrtf-sofa/room/room_SR.wav" channel = 1 gain = 0.125 } }
                    { type = builtin label = convolver name = rmRLL
                      config = { filename = "/home/yngwe/.local/share/pipewire/hrtf-sofa/room/room_RL.wav" channel = 0 gain = 0.125 } }
                    { type = builtin label = convolver name = rmRLR
                      config = { filename = "/home/yngwe/.local/share/pipewire/hrtf-sofa/room/room_RL.wav" channel = 1 gain = 0.125 } }
                    { type = builtin label = convolver name = rmRRL
                      config = { filename = "/home/yngwe/.local/share/pipewire/hrtf-sofa/room/room_RR.wav" channel = 0 gain = 0.125 } }
                    { type = builtin label = convolver name = rmRRR
                      config = { filename = "/home/yngwe/.local/share/pipewire/hrtf-sofa/room/room_RR.wav" channel = 1 gain = 0.125 } }

                    # LFE is not directional: send it to both ears, at a level
                    # comparable to the spatialized channels' bass.
                    { type = builtin label = copy name = copyLFE }

                    # Direct sound (+ LFE) and room per ear, then direct + room.
                    { type = builtin label = mixer name = mixL
                      control = { "Gain 8" = 0.5 } }
                    { type = builtin label = mixer name = mixR
                      control = { "Gain 8" = 0.5 } }
                    { type = builtin label = mixer name = roomL }
                    { type = builtin label = mixer name = roomR }
                    # "Gain 1" is the direct sound, "Gain 2" the room; their ratio is the room
                    # amount (1 = as measured in SADIE's fairly dry room). 4x reads as much more
                    # "out of the head"; both are halved so the level stays as without room.
                    # Full-scale stereo peaks at -9 dBFS worst case (all 7 channels: -2.6). Live:
                    #   pw-cli set-param effect_input.maxwell_3d Props '{ params = [ "outL:Gain 2" 1.0 "outR:Gain 2" 1.0 ] }'
                    { type = builtin label = mixer name = outL
                      control = { "Gain 1" = 0.5 "Gain 2" = 2.0 } }
                    { type = builtin label = mixer name = outR
                      control = { "Gain 1" = 0.5 "Gain 2" = 2.0 } }
                ]
                links = [
                    { output = "inFL:Out" input = "spFL:In" }
                    { output = "inFL:Out" input = "rmFLL:In" }
                    { output = "inFL:Out" input = "rmFLR:In" }
                    { output = "inFR:Out" input = "spFR:In" }
                    { output = "inFR:Out" input = "rmFRL:In" }
                    { output = "inFR:Out" input = "rmFRR:In" }
                    { output = "inFC:Out" input = "spFC:In" }
                    { output = "inFC:Out" input = "rmFCL:In" }
                    { output = "inFC:Out" input = "rmFCR:In" }
                    { output = "inSL:Out" input = "spSL:In" }
                    { output = "inSL:Out" input = "rmSLL:In" }
                    { output = "inSL:Out" input = "rmSLR:In" }
                    { output = "inSR:Out" input = "spSR:In" }
                    { output = "inSR:Out" input = "rmSRL:In" }
                    { output = "inSR:Out" input = "rmSRR:In" }
                    { output = "inRL:Out" input = "spRL:In" }
                    { output = "inRL:Out" input = "rmRLL:In" }
                    { output = "inRL:Out" input = "rmRLR:In" }
                    { output = "inRR:Out" input = "spRR:In" }
                    { output = "inRR:Out" input = "rmRRL:In" }
                    { output = "inRR:Out" input = "rmRRR:In" }
                    { output = "spFL:Out L" input = "mixL:In 1" }
                    { output = "spFL:Out R" input = "mixR:In 1" }
                    { output = "spFR:Out L" input = "mixL:In 2" }
                    { output = "spFR:Out R" input = "mixR:In 2" }
                    { output = "spFC:Out L" input = "mixL:In 3" }
                    { output = "spFC:Out R" input = "mixR:In 3" }
                    { output = "spSL:Out L" input = "mixL:In 4" }
                    { output = "spSL:Out R" input = "mixR:In 4" }
                    { output = "spSR:Out L" input = "mixL:In 5" }
                    { output = "spSR:Out R" input = "mixR:In 5" }
                    { output = "spRL:Out L" input = "mixL:In 6" }
                    { output = "spRL:Out R" input = "mixR:In 6" }
                    { output = "spRR:Out L" input = "mixL:In 7" }
                    { output = "spRR:Out R" input = "mixR:In 7" }
                    { output = "copyLFE:Out" input = "mixL:In 8" }
                    { output = "copyLFE:Out" input = "mixR:In 8" }
                    { output = "rmFLL:Out" input = "roomL:In 1" }
                    { output = "rmFLR:Out" input = "roomR:In 1" }
                    { output = "rmFRL:Out" input = "roomL:In 2" }
                    { output = "rmFRR:Out" input = "roomR:In 2" }
                    { output = "rmFCL:Out" input = "roomL:In 3" }
                    { output = "rmFCR:Out" input = "roomR:In 3" }
                    { output = "rmSLL:Out" input = "roomL:In 4" }
                    { output = "rmSLR:Out" input = "roomR:In 4" }
                    { output = "rmSRL:Out" input = "roomL:In 5" }
                    { output = "rmSRR:Out" input = "roomR:In 5" }
                    { output = "rmRLL:Out" input = "roomL:In 6" }
                    { output = "rmRLR:Out" input = "roomR:In 6" }
                    { output = "rmRRL:Out" input = "roomL:In 7" }
                    { output = "rmRRR:Out" input = "roomR:In 7" }
                    { output = "mixL:Out" input = "outL:In 1" }
                    { output = "roomL:Out" input = "outL:In 2" }
                    { output = "mixR:Out" input = "outR:In 1" }
                    { output = "roomR:Out" input = "outR:In 2" }
                ]
                inputs  = [ "inFL:In" "inFR:In" "inFC:In" "copyLFE:In"
                            "inRL:In" "inRR:In" "inSL:In" "inSR:In" ]
                outputs = [ "outL:Out" "outR:Out" ]
            }
            capture.props = {
                node.name      = "effect_input.maxwell_3d"
                media.class    = Audio/Sink
                audio.channels = 8
                audio.position = [ FL FR FC LFE RL RR SL SR ]
            }
            playback.props = {
                node.name      = "effect_output.maxwell_3d"
                node.passive   = true
                audio.channels = 2
                audio.position = [ FL FR ]
                # The Maxwell's game channel through the wireless dongle, with the card in
                # the "Pro Audio" profile: pro-output-0 is chat, pro-output-1 is game.
                # On USB-C alone (no dongle) it is
                # alsa_output.usb-Audeze_LLC_Audeze_Maxwell_Headset_0000000000000000-00.pro-output-1
                target.object = "alsa_output.usb-Audeze_LLC_Audeze_Maxwell_Dongle_0000000000000000-00.pro-output-1"
            }
        }
    }
]
